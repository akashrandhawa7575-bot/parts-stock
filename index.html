<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Parts Stock</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mute:#5d6b7a;--line:#d5dce3;--ok:#0f6b5c;--low:#c2410c;--btn:#1b2430;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a21;--card:#1d252e;--ink:#eaeef2;--mute:#97a4b2;--line:#303b47;--ok:#4cc2ab;--low:#f08a5d;--btn:#eaeef2;--btnink:#141a21}}
:root[data-theme="dark"]{--bg:#141a21;--card:#1d252e;--ink:#eaeef2;--mute:#97a4b2;--line:#303b47;--ok:#4cc2ab;--low:#f08a5d;--btn:#eaeef2;--btnink:#141a21}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;margin:8px 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--btn);color:var(--btnink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--mute);padding:2px 6px;font-weight:500;font-size:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>input[type=number]{width:96px;flex:none}
.add{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
.add h2{font-size:17px;margin:0 0 10px}
.add .row{margin:0}
.part{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.name{font-size:20px;font-weight:600}
.meta{color:var(--mute);font-size:14px}
.num{font-size:40px;font-weight:700;line-height:1;color:var(--ok);text-align:right}
.num.low{color:var(--low)}
.num small{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:4px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.form{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.form label{font-size:14px;color:var(--mute);display:block;margin-bottom:4px}
.hist{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.hist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist li:last-child{border-bottom:0}
.reg{font-weight:700;letter-spacing:.02em}
.in{color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.hit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.hit h3{margin:0 0 6px;font-size:16px}
</style>
</head>
<body>
<main>
  <h1>Parts stock</h1>
  <p class="sub">Add parts, fit them to a bike, and always see what’s left.</p>
  <p id="status" class="meta" style="margin:-8px 0 16px"></p>

  <div class="add" id="addBox">
    <h2>Add a new part</h2>
    <div class="row">
      <input id="newName" placeholder="Part name (e.g. Spark plug)" aria-label="Part name">
      <input id="newQty" type="number" min="1" value="10" aria-label="How many">
    </div>
    <button id="addBtn">Add part</button>
  </div>

  <input id="search" placeholder="Search a part or a bike number" aria-label="Search" style="margin-bottom:14px">
  <div id="bikeHits"></div>
  <div id="list"></div>

  <div class="add" style="margin-top:22px">
    <h2>Backup</h2>
    <p class="meta" id="bkInfo" style="margin:0 0 10px"></p>
    <div class="row" style="margin:0">
      <button class="ghost" id="bkSave">Save backup file</button>
      <button class="ghost" id="bkLoad">Restore from backup</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
  </div>
</main>

<script>
(function(){
  var KEY="partsStockV1", BK="partsStockLastBackup", data={parts:[],log:[]}, openForm=null, openHist={}, canWrite=true;
  try{var s0=localStorage.getItem(KEY); if(s0){var d0=JSON.parse(s0); if(d0&&d0.parts&&d0.log) data=d0;}}catch(e){}
  function setStatus(t){var el=document.getElementById("status");if(el)el.textContent=t;}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){setStatus("Couldn’t save on this device. Save a backup file now.");}bkInfo();}
  function bkInfo(){
    var el=document.getElementById("bkInfo");if(!el)return;var t=null;try{t=localStorage.getItem(BK);}catch(e){}
    var days=t?Math.floor((Date.now()-(+t))/86400000):null;
    el.textContent=t?("Last backup: "+(days<=0?"today":days+" day"+(days>1?"s":"")+" ago")):"No backup yet. Save one so you don’t lose your stock if the phone is reset.";
    el.style.color=((!t||days>7)&&data.parts.length)?"var(--low)":"";
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fmt(iso){var p=iso.split("-");var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return +p[2]+" "+m[+p[1]-1]+" "+p[0];}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function normReg(r){return r.toUpperCase().replace(/\s+/g," ").trim();}
  function key(r){return r.toUpperCase().replace(/[^A-Z0-9]/g,"");}
  function stats(id){var inn=0,fit=0;data.log.forEach(function(l){if(l.partId!==id)return;if(l.type==="in")inn+=l.qty;else fit+=l.qty;});return {inn:inn,fit:fit,stock:inn-fit};}

  function render(){
    var q=document.getElementById("search").value.trim(), qk=key(q), ql=q.toLowerCase();
    var hits="";
    if(qk.length>=3){
      var f=data.log.filter(function(l){return l.type==="fit"&&key(l.reg).indexOf(qk)>-1;}).sort(function(a,b){return b.date.localeCompare(a.date);});
      if(f.length){
        hits='<div class="hit"><h3>Parts fitted to bikes matching “'+esc(q)+'”</h3><ul class="hist">'+f.map(function(l){
          var p=data.parts.find(function(x){return x.id===l.partId;});
          return '<li><span>'+esc(p?p.name:"?")+' ×'+l.qty+' on <span class="reg">'+esc(l.reg)+'</span></span><span>'+fmt(l.date)+'</span></li>';
        }).join("")+'</ul></div>';
      }
    }
    document.getElementById("bikeHits").innerHTML=hits;

    var parts=data.parts.filter(function(p){return !ql||p.name.toLowerCase().indexOf(ql)>-1;});
    var el=document.getElementById("list");
    if(!data.parts.length){el.innerHTML='<div class="empty">No parts yet.'+(canWrite?' Add your first part above.':'')+'</div>';return;}
    if(!parts.length){el.innerHTML='<div class="empty">No part with that name.</div>';return;}
    el.innerHTML=parts.map(function(p){
      var s=stats(p.id), low=s.stock<=2;
      var h='<div class="part"><div class="top"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+s.inn+' added · '+s.fit+' fitted</div></div>'
        +'<div class="num'+(low?' low':'')+'">'+s.stock+'<small>in stock</small></div></div>'
        +'<div class="acts">'+(canWrite?'<button data-a="fit" data-id="'+p.id+'">Fit to a bike</button><button class="ghost" data-a="more" data-id="'+p.id+'">Add stock</button>':'')+'<button class="link" data-a="hist" data-id="'+p.id+'">'+(openHist[p.id]?'Hide history':'History')+'</button></div>';
      if(openForm&&openForm.id===p.id){
        if(openForm.kind==="fit"){
          h+='<div class="form"><label>Bike registration number</label><div class="row"><input id="fReg" placeholder="e.g. PB 02 AB 1234" autocapitalize="characters"></div>'
            +'<label>Date fitted</label><div class="row"><input id="fDate" type="date" value="'+today()+'"><input id="fQty" type="number" min="1" value="1" aria-label="How many"></div>'
            +'<button data-a="savefit" data-id="'+p.id+'">Save</button> <button class="ghost" data-a="cancel">Cancel</button><div id="err" class="meta" style="color:var(--low);margin-top:8px"></div></div>';
        }else{
          h+='<div class="form"><label>How many did you buy?</label><div class="row"><input id="mQty" type="number" min="1" value="1"></div>'
            +'<button data-a="savemore" data-id="'+p.id+'">Add to stock</button> <button class="ghost" data-a="cancel">Cancel</button></div>';
        }
      }
      if(openHist[p.id]){
        var ls=data.log.filter(function(l){return l.partId===p.id;}).sort(function(a,b){return b.ts-a.ts;});
        h+=ls.length?'<ul class="hist">'+ls.map(function(l){
          var t=l.type==="fit"?'Fitted ×'+l.qty+' to <span class="reg">'+esc(l.reg)+'</span> on '+fmt(l.date):'<span class="in">Added ×'+l.qty+'</span> on '+fmt(l.date);
          return '<li><span>'+t+'</span>'+(canWrite?'<button class="link" data-a="undo" data-lid="'+l.id+'">Undo</button>':'')+'</li>';
        }).join("")+'</ul>':'';
        if(canWrite) h+='<div style="margin-top:8px"><button class="link" data-a="del" data-id="'+p.id+'">Delete this part</button></div>';
      }
      return h+'</div>';
    }).join("");
  }

  document.getElementById("addBtn").onclick=function(){
    if(!canWrite)return;
    var n=document.getElementById("newName"), qn=document.getElementById("newQty");
    var name=n.value.trim(), qty=parseInt(qn.value,10);
    if(!name||!(qty>=0)){n.focus();return;}
    var id=uid(); data.parts.push({id:id,name:name});
    if(qty>0) data.log.push({id:uid(),partId:id,type:"in",qty:qty,reg:"",date:today(),ts:Date.now()});
    n.value="";qn.value=10;save();render();
  };
  document.getElementById("search").oninput=render;
  document.getElementById("list").onclick=function(e){
    var b=e.target.closest("button"); if(!b)return;
    var a=b.dataset.a, id=b.dataset.id;
    if(!canWrite&&a!=="hist")return;
    if(a==="fit"||a==="more"){openForm={id:id,kind:a==="fit"?"fit":"more"};render();var f=document.getElementById(a==="fit"?"fReg":"mQty");if(f)f.focus();}
    else if(a==="cancel"){openForm=null;render();}
    else if(a==="hist"){openHist[id]=!openHist[id];render();}
    else if(a==="savefit"){
      var reg=normReg(document.getElementById("fReg").value), date=document.getElementById("fDate").value, qty=parseInt(document.getElementById("fQty").value,10), err=document.getElementById("err");
      if(!reg){err.textContent="Type the bike’s registration number.";return;}
      if(!date){err.textContent="Choose the date.";return;}
      if(!(qty>=1)){err.textContent="Enter how many.";return;}
      if(qty>stats(id).stock){err.textContent="Only "+stats(id).stock+" left in stock.";return;}
      data.log.push({id:uid(),partId:id,type:"fit",qty:qty,reg:reg,date:date,ts:Date.now()});
      openForm=null;openHist[id]=true;save();render();
    }
    else if(a==="savemore"){
      var m=parseInt(document.getElementById("mQty").value,10); if(!(m>=1))return;
      data.log.push({id:uid(),partId:id,type:"in",qty:m,reg:"",date:today(),ts:Date.now()});
      openForm=null;save();render();
    }
    else if(a==="undo"){
      var lid=b.dataset.lid, l=data.log.find(function(x){return x.id===lid;});
      if(l&&l.type==="in"&&stats(l.partId).stock-l.qty<0){alert("Can’t remove this — those parts are already fitted.");return;}
      data.log=data.log.filter(function(x){return x.id!==lid;});save();render();
    }
    else if(a==="del"){
      if(confirm("Delete this part and its history?")){data.parts=data.parts.filter(function(p){return p.id!==id;});data.log=data.log.filter(function(l){return l.partId!==id;});save();render();}
    }
  };
  document.getElementById("bkSave").onclick=function(){
    var blob=new Blob([JSON.stringify({app:"parts-stock",saved:new Date().toISOString(),data:data},null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="parts-stock-backup-"+today()+".json";
    document.body.appendChild(a);a.click();a.remove();
    try{localStorage.setItem(BK,String(Date.now()));}catch(e){}
    bkInfo();
  };
  document.getElementById("bkLoad").onclick=function(){document.getElementById("bkFile").click();};
  document.getElementById("bkFile").onchange=function(e){
    var f=e.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result), d=j.data||j;
        if(!d.parts||!d.log) throw 0;
        if(data.parts.length&&!confirm("This replaces the stock on this device with the backup. Continue?")) return;
        data={parts:d.parts,log:d.log}; save(); render();
      }catch(x){alert("This file isn’t a valid backup.");}
    };
    r.readAsText(f); e.target.value="";
  };
  setStatus("Works offline. Your stock is saved on this device.");
  bkInfo(); render();
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js");}catch(e){}
})();
</script>
</body>
</html>
